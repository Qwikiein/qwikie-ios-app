<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport"

                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color" content="#ffffff">

    <title>Qwikie</title>

    <style>

            display: block;

<body>
